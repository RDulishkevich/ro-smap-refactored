    #boot-fail.is-on {
      display: flex;

      inset: 0;

      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #E8EDEA;
      font-family: system-ui, sans-serif;
    }
    #boot-fail .card {
      width: min(420px, 100%);
      background: #fff;
      border-radius: 24px;
      padding: 32px 28px 28px;
      text-align: center;
      box-shadow: 0 18px 48px rgba(45, 60, 57, 0.12);
    }
    #boot-fail h1 {
      margin: 0 0 10px;
      font-family: Klukva, Georgia, "Times New Roman", serif;
      font-size: 26px;
      font-weight: 400;
      font-synthesis: none;

    }
    #boot-fail p { margin: 0 0 24px; color: #6F7C4E; font-size: 14px; line-height: 1.55; }
    #boot-fail a {
      display: flex;

    #welcome-splash { display: none; }
    #welcome-splash.is-on {
      display: flex;
      position: fixed;
      inset: 0;

      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #E8EDEA;
      font-family: system-ui, sans-serif;
    }
    #welcome-splash .mark {
      width: 88px;
      height: 88px;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(45, 60, 57, 0.16);
      margin-bottom: 20px;
      background: #F4E8D8;
    }
    #welcome-splash .mark img { width: 100%; height: 100%; object-fit: cover; }

      margin: 0 0 8px;

  <body>
    <div id="root"></div>
    <div id="welcome-splash" aria-hidden="true">
      <div class="mark"><img src="/apple-touch-icon.png" alt="" /></div>
      <h1>Полёвка</h1>
      <p>Полевые записи рядом с вами</p>
    </div>
    <noscript>
      <div id="boot-fail" class="is-on">
        <div class="card">
          <h1>Нужен JavaScript</h1>
          <p>Полёвка — живая карта записей. Включите JavaScript в браузере, чтобы открыть её.</p>
        </div>
      </div>
    </noscript>
    <div id="boot-fail">
      <div class="card">
        <h1>Что-то сломалось</h1>
        <p>Страница споткнулась. Данные на карте в порядке — просто обновите Полёвку.</p>
        <a href="/">Попробовать снова</a>
      </div>
    </div>
    <script>
      (function () {
        function show() {
          var el = document.getElementById('boot-fail');
          if (el) el.classList.add('is-on');
        }
        window.__polevkaReady = function () {
          clearTimeout(window.__polevkaBoot);
          var el = document.getElementById('boot-fail');
          if (el) el.classList.remove('is-on');
        };
        (function showWelcome() {
          var standalone = (window.matchMedia && (
            window.matchMedia('(display-mode: standalone)').matches
            || window.matchMedia('(display-mode: fullscreen)').matches
          )) || window.navigator.standalone === true;
          if (standalone) document.documentElement.classList.add('is-standalone');
          var splash = document.getElementById('welcome-splash');
          if (splash) {
            splash.classList.add('is-on');
            splash.setAttribute('aria-hidden', 'false');
          }
        })();
        window.addEventListener('error', function (ev) {
          if (ev.target && ev.target.tagName === 'SCRIPT') show();
        }, true);
        window.__polevkaBoot = setTimeout(function () {
          var r = document.getElementById('root');
          if (r && !r.querySelector('[data-app]') && !r.children.length) show();
        }, 12000);
      })();
    </script>
  </body>
