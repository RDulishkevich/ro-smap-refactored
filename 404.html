    <script>
      (function () {
        var ready = false;
        function show() {
          if (ready) return;
          var el = document.getElementById('boot-fail');

          el.classList.add('is-on');
          el.removeAttribute('hidden');
          el.setAttribute('aria-hidden', 'false');

          if (!t || t.tagName !== 'SCRIPT') return;
          var src = String(t.src || '');
          // Only our app bundle — Yandex Maps script noise must not flash boot-fail.
          if (!/\/assets\/index-|\/src\/main\.tsx/.test(src)) return;
          show();
        }, true);
        window.__polevkaBoot = setTimeout(function () {
          var r = document.getElementById('root');
          if (r && !r.querySelector('[data-app]') && !r.children.length) show();
        }, 12000);
