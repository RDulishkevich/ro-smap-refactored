<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Полёвка</title>
    <meta name="description" content="Аудиокарта Ростовской области: слушать, находить и добавлять полевые записи." />
    <link rel="icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#B5613F" />
    <style>
    #boot-fail { display: none; }
    #boot-fail.is-on {
      display: flex;
      position: fixed;
      inset: 0;
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #E8EDEA;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    #boot-fail .card {
      width: min(420px, 100%);
      background: #fff;
      border-radius: 24px;
      padding: 32px 28px 28px;
      text-align: center;
      box-shadow: 0 18px 48px rgba(45, 60, 57, 0.12);
    }
    #boot-fail h1 {
      margin: 0 0 10px;
      font-family: Georgia, serif;
      font-size: 28px;
      font-weight: 500;
    }
    #boot-fail p { margin: 0 0 24px; color: #6F7C4E; font-size: 14px; line-height: 1.55; }
    #boot-fail a {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 48px;
      border-radius: 16px;
      background: #B5613F;
      color: #fff;
      text-decoration: none;
      font-size: 15px;
    }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div id="boot-fail" class="is-on">
        <div class="card">
          <h1>Нужен JavaScript</h1>
          <p>Полёвка — живая карта записей. Включите JavaScript в браузере, чтобы открыть её.</p>
        </div>
      </div>
    </noscript>
    <div id="boot-fail">
      <div class="card">
        <h1>Что-то сломалось</h1>
        <p>Страница споткнулась. Данные на карте в порядке — просто обновите Полёвку.</p>
        <a href="/">Попробовать снова</a>
      </div>
    </div>
    <script>
      (function () {
        function show() {
          var el = document.getElementById('boot-fail');
          if (el) el.classList.add('is-on');
        }
        window.__polevkaReady = function () {
          clearTimeout(window.__polevkaBoot);
          var el = document.getElementById('boot-fail');
          if (el) el.classList.remove('is-on');
        };
        window.addEventListener('error', function (ev) {
          if (ev.target && ev.target.tagName === 'SCRIPT') show();
        }, true);
        window.__polevkaBoot = setTimeout(function () {
          var r = document.getElementById('root');
          if (r && !r.querySelector('[data-app]') && !r.children.length) show();
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
